<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Treeni">
<meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1620" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Treenipäiväkirja</title>
<style>
:root{
  --bg:#ECEFF3;--card:#FFFFFF;--input:#F2F4F7;--ink:#14202E;--muted:#5B6878;--line:#DDE3EA;
  --acc:#2F55D4;--acc-ink:#FFFFFF;--acc-soft:#E2E8FB;
  --warn:#7A5000;--warn-soft:#FBEFD5;
  --easy:#23874D;--med:#D2930F;--heavy:#CF3E2B;--none:#A6B1BD;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1620;--card:#18212C;--input:#212C39;--ink:#E8EDF3;--muted:#94A2B1;--line:#2A3543;
    --acc:#7B96F2;--acc-ink:#0B1530;--acc-soft:#1F2B4D;
    --warn:#F0C060;--warn-soft:#3A2E14;--none:#5E6B79;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px)}
body.insession main{padding-top:0;padding-bottom:calc(env(safe-area-inset-bottom) + 104px)}
h1,h2,h3{font-family:var(--display);letter-spacing:.005em}
h1{font-size:38px;line-height:1;margin:4px 0 4px;font-weight:700}
h2{font-size:22px;line-height:1.1;font-weight:600;margin:28px 0 10px}
h3{font-size:21px;line-height:1.15;font-weight:600;margin:0}
p{margin:6px 0}
.sub{color:var(--muted);margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
.err{color:var(--heavy)}
.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0}
.card.accent{background:var(--acc-soft)}
.card.warn{background:var(--warn-soft)}
.card.warn > b{color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:0;background:var(--input);color:var(--ink);border-radius:14px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:46px}
.btn.primary{background:var(--acc);color:var(--acc-ink)}
.btn.small{padding:7px 12px;min-height:36px;font-size:15px;border-radius:11px}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.danger{color:var(--heavy);background:transparent;box-shadow:inset 0 0 0 1.5px var(--heavy)}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.35}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[data-act]:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--input);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none}
textarea{resize:vertical}
textarea.mono{font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 0}
label > input,label > select,label > textarea{margin-top:5px;color:var(--ink)}
.inline{display:flex;align-items:center;gap:8px}
.inline input{width:auto}
.chip{display:inline-block;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--input);margin:2px 4px 2px 0}
.chip.ok{background:var(--acc-soft)}
.chip.miss{color:var(--heavy);box-shadow:inset 0 0 0 1px var(--heavy);background:transparent}
.chip.info{background:var(--warn-soft)}
.cdot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.tgl{border:0;border-radius:99px;font:inherit;font-size:12.5px;font-weight:600;padding:6px 11px;cursor:pointer;background:var(--input);color:var(--muted);min-height:32px}
.tgl.on{background:var(--acc-soft);color:var(--acc)}
/* listat */
.group{background:var(--card);border-radius:var(--r);margin:10px 0;overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow[data-act]{cursor:pointer}
.lrow b{font-weight:600}
.listrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.listrow:first-child{border-top:0}
.chev{color:var(--muted);font-size:20px}
details.card summary{cursor:pointer;color:var(--muted);font-size:15px;font-weight:600}
/* tänään */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:16px 0 8px}
.wd{background:var(--card);border-radius:14px;padding:8px 0 10px;text-align:center;min-height:88px}
.wd span{display:block;font-size:12px;color:var(--muted)}
.wd b{display:block;font-family:var(--display);font-size:24px;font-weight:600;line-height:1.1}
.wd.today{background:var(--ink);color:var(--bg)}
.wd.today span{color:inherit;opacity:.7}
.wd.future b{opacity:.55}
.marks{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px}
.marks i{display:block;width:62%;height:7px;border-radius:4px}
.marks i.plan{background:transparent!important;box-shadow:inset 0 0 0 1.5px currentColor}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin:2px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .cdot{width:9px;height:9px}
.hero{background:var(--c);color:#fff;border-radius:24px;padding:18px 18px 16px;margin:18px 0 6px}
.hero .tag{font-size:14px;opacity:.85}
.hero h2{font-size:38px;line-height:1;margin:4px 0 6px;color:#fff;font-weight:700}
.hero p{margin:0;opacity:.9;font-size:15px}
.hero .row{margin-top:16px}
.hero .btn{background:#fff;color:var(--c);font-size:17px;min-height:52px;flex:1}
.hero .btn.alt{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.75);flex:0 0 auto}
.btn.alt{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.rest{background:var(--card);border-radius:24px;padding:20px 18px;margin:18px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .btn{background:var(--card)}
.issues{margin:6px 0 0;padding-left:20px}
.issues li{margin:5px 0}
.issues .sugg{display:block;font-size:13px;color:var(--muted)}
.pdots{display:flex;gap:3px;flex:none}
/* treeni */
.sesshead{position:sticky;top:0;z-index:4;background:var(--bg);margin:0 -16px 4px;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
.shrow{display:flex;align-items:center;gap:10px}
.iconbtn{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:28px;line-height:1;cursor:pointer;padding-bottom:4px}
.st b{font-family:var(--display);font-size:25px;font-weight:700;display:block;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st span{font-size:13px;color:var(--muted)}
.datepill{width:auto;min-height:36px;padding:4px 8px;font-size:14px;background:var(--card);border-radius:10px}
.prog{height:5px;background:var(--line);border-radius:3px;margin:10px 0 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);border-radius:3px;transition:width .3s}
.note{background:var(--card);border-left:4px solid var(--c);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:15px}
.exc{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;scroll-margin-top:110px}
.exc.done{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.exc.done b{font-weight:600}
.check{width:30px;height:30px;border-radius:50%;background:var(--easy);color:#fff;display:grid;place-items:center;font-size:16px;flex:none}
.check.n{background:var(--none)}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exhead h3{font-size:25px;line-height:1.05}
.exhd-r{display:flex;gap:6px;align-items:center;flex:none}
.info{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--acc);background:none;color:var(--acc);font:italic 700 16px/1 Georgia,serif;cursor:pointer;flex:none}
.goal{font-size:14px;color:var(--muted);margin-top:6px}
.goal b{color:var(--ink);font-weight:600}
.shead,.srow{display:grid;grid-template-columns:22px 1fr 1fr;gap:10px;align-items:center}
.shead{font-size:12px;color:var(--muted);margin:14px 0 2px;text-align:center}
.sblock{padding:8px 0 10px;border-top:1px solid var(--line)}
.sblock:first-of-type{border-top:0}
.srate{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;margin-top:7px}
.stime{font-size:12.5px;color:var(--muted);margin:5px 0 0 32px}
.sn{font-family:var(--display);font-size:19px;color:var(--muted);text-align:center}
.stp{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;background:var(--input);border-radius:13px;height:50px}
.stp button{border:0;background:none;color:var(--acc);font-size:26px;font-weight:500;height:50px;cursor:pointer;border-radius:13px}
.stp button:active{background:var(--acc-soft)}
.stp input{border:0;background:none;text-align:center;font-family:var(--display);font-size:26px;font-weight:600;padding:0;min-height:0;height:50px;width:100%;font-variant-numeric:tabular-nums;border-radius:8px}
.exact{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.linkbtn{border:0;background:none;color:var(--acc);font:inherit;font-size:15px;font-weight:600;padding:8px 6px;cursor:pointer;min-height:40px}
.linkbtn.danger{color:var(--heavy);margin-left:auto}
.ask{font-size:14px;color:var(--muted);margin:10px 0 0}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;border:0;background:var(--input);color:var(--ink);font:inherit;font-size:15px;font-weight:600;padding:10px 4px;cursor:pointer;min-height:48px;border-radius:12px}
.seg.sm{margin-top:0;gap:5px}
.seg.sm button{min-height:38px;font-size:14px;padding:6px 2px;border-radius:10px}
.seg button.on[data-r=easy]{background:var(--easy);color:#fff}
.seg button.on[data-r=medium]{background:var(--med);color:#fff}
.seg button.on[data-r=heavy]{background:var(--heavy);color:#fff}
.seg.tabs{background:var(--card);padding:4px;border-radius:14px;gap:2px}
.seg.tabs button{background:transparent;min-height:40px;font-size:14px;border-radius:10px}
.seg.tabs button.on{background:var(--ink);color:var(--bg)}
.hint{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.hint.up,.hint.range,.hint.chain{background:var(--acc-soft)}
.hint.coach{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
.hint.hold{background:var(--warn-soft)}
.hint.info{background:var(--input)}
.hint .btn{background:var(--acc);color:var(--acc-ink)}
.big input{font-family:var(--display);font-size:26px;font-weight:600;height:54px}
.sessbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;justify-content:center}
.sessbar .btn{min-height:52px;font-size:17px}
.sessbar .btn.primary{flex:1;max-width:480px}
body.insession nav{display:none}
/* historia */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.pdots .dot{margin:0;width:9px;height:9px}
.d-easy{background:var(--easy)}.d-medium{background:var(--med)}.d-heavy{background:var(--heavy)}.d-none{background:var(--none)}
.bar{display:grid;grid-template-columns:96px 1fr 64px;gap:8px;align-items:center;margin:9px 0;font-size:14px}
.bar b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.bar b small{color:var(--muted);font-weight:400}
.bar .track{position:relative;background:var(--input);border-radius:6px;height:14px}
.bar .fill{background:var(--acc);height:100%;border-radius:6px}
.bar .fill.over{background:var(--heavy)}
.bar .fill.under{background:var(--med)}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--ink);opacity:.5}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:6px 4px;text-align:center;border-top:1px solid var(--line)}
.tbl th{font-weight:600;color:var(--muted)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tl{display:grid;grid-template-columns:44px 1fr 14px;gap:2px 8px;align-items:center;font-size:14px;padding:7px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl.chg{border-top:2px solid var(--ink)}
.tl .dot{margin:0}
.tlr{grid-column:2/4;font-size:12px;color:var(--muted)}
.pick{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.pick:first-child{border-top:0}
.pick input{width:22px;min-height:22px;margin-top:2px;flex:none}
/* suunnitelma */
.itemrow{border-top:1px solid var(--line);padding:10px 0}
.itemrow .mini{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.itemrow .mini input{width:50px;text-align:center;padding:7px 4px;min-height:40px}
.tplbox{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.sw{width:36px;height:36px;border-radius:50%;border:0;cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink)}
.mgrid{display:grid;grid-template-columns:1fr 76px;gap:6px 10px;align-items:center;margin-top:8px}
.mgrid input{text-align:center;min-height:40px;padding:6px}
.trow{display:grid;grid-template-columns:1fr 58px 58px 34px;gap:6px;align-items:center;margin:6px 0}
.trow input{padding:8px 6px;min-height:42px}
.trow input.n{text-align:center}
.thead{font-size:12px;color:var(--muted)}
.rrow{display:grid;grid-template-columns:1fr auto 52px auto 1fr 30px;gap:5px;align-items:center;margin:8px 0;font-size:14px}
.rrow select{padding:8px 6px;min-height:40px;font-size:14px}
.rrow input{text-align:center;padding:8px 2px;min-height:40px}
.drow{display:grid;grid-template-columns:1fr auto 1fr auto 34px;gap:6px;align-items:center;margin:6px 0;font-size:14px;color:var(--muted)}
.drow input{text-align:center;min-height:42px;padding:8px 4px}
.u{font-size:12px;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;min-height:40px;min-width:34px}
svg text{fill:var(--muted);font-size:10px}
svg text.lab{fill:var(--ink);font-size:10.5px;font-weight:600}
svg .grid{stroke:var(--line)}
svg .ln{stroke:var(--acc);fill:none;stroke-width:2.5}
/* navigaatio: kiinteä, läpinäkymätön palkki alareunassa */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;padding:7px 2px 8px;cursor:pointer;min-height:56px}
nav svg{display:block;margin:0 auto 2px;width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
#modalbg{position:fixed;inset:0;background:rgba(10,16,24,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
#modalbg .panel{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(env(safe-area-inset-bottom) + 76px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:15px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
body.insession #toast{bottom:calc(env(safe-area-inset-bottom) + 84px)}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav">
  <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Tänään</button>
  <button data-act="tab" data-tab="history"><svg viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M7.5 15l3.5-4.5 3 2.5 5-6.5"/></svg>Historia</button>
  <button data-act="tab" data-tab="plan"><svg viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.8" cy="6.5" r="1.3"/><circle cx="4.8" cy="12" r="1.3"/><circle cx="4.8" cy="17.5" r="1.3"/></svg>Suunnitelma</button>
  <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="9.5" cy="17" r="2.3"/></svg>Asetukset</button>
</nav>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="importfile" accept=".json,application/json,text/plain" hidden>
<script>
'use strict';
const KEY='treeni.v1', DRAFT_KEY='treeni.draft', APPV='6.1';
const WD=['su','ma','ti','ke','to','pe','la'];
const WD_LONG=['sunnuntai','maanantai','tiistai','keskiviikko','torstai','perjantai','lauantai'];
const WD_EVERY=['sunnuntaisin','maanantaisin','tiistaisin','keskiviikkoisin','torstaisin','perjantaisin','lauantaisin'];
const RATE={easy:'Helppo',medium:'Keskiraskas',heavy:'Raskas'};
const RATE_S={easy:'Helppo',medium:'Keski',heavy:'Raskas'};
const RATE_L={easy:'H',medium:'K',heavy:'R'};
const RANK={easy:1,medium:2,heavy:3};
const PALETTE=['#2F55D4','#C85F12','#23874D','#6B45C2','#B83E7C','#157F8A','#4F5D6E','#B8860B'];
const EQUIP={machine:'Laite',free:'Tanko / vapaa paino',dumbbell:'Käsipainopari',dumbbell1:'Yksi käsipaino',bodyweight:'Kehonpaino'};
const SCHED={fixed:'Kiinteä viikonpäivä',flexible:'Joustava viikkokiintiö',adhoc:'Satunnainen (ei aikataulua)'};
const LOG={tick:'Pelkkä kuittaus',full:'Sarjat, toistot ja painot',activity:'Kesto ja matka'};
const COACH_EXAMPLE=`{
  "muoto": "treeni-valmennus",
  "versio": 1,
  "pvm": "2026-11-22",
  "yhteenveto": "Lyhyt kuvaus viikon havainnoista",
  "liikkeet": [
    {"id": "penkki", "nimi": "Penkkipunnerrus", "paino": 42.5, "toistot": 8, "perustelu": "Kaikki sarjat 12 helposti"},
    {"id": "leuka", "toistoalue": [5, 8], "perustelu": "3×5 on mennyt helposti kahdesti"},
    {"id": "kpsoutu", "lisays": 2, "perustelu": "Lisää 2 kg edelliseen"}
  ],
  "lihastavoitteet": [{"ryhma": "etureisi", "max": 6}]
}`;

/* Liiketietämys: lihaskertoimet (1 = päälihas, 0,5 = avustava) ja lyhyt suoritusohje. Ensimmäinen osuma nimeen ratkaisee. */

function ymd(d=new Date()){return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function parseYmd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);}
function weekStart(s){const d=parseYmd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);}
function isoWeek(s){const d=parseYmd(s);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7);}
function fmtDM(s){const d=parseYmd(s);return d.getDate()+'.'+(d.getMonth()+1)+'.';}
function fmtDay(s){const d=parseYmd(s);return WD[d.getDay()]+' '+fmtDM(s);}
function daysBetween(a,b){return Math.round((parseYmd(b)-parseYmd(a))/864e5);}
function hm(t){const d=new Date(t);return z(d.getHours())+'.'+z(d.getMinutes());}
function hms(t){const d=new Date(t);return z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds());}
function durTxt(sec){if(sec==null||sec<0)return '';if(sec>=3600)return Math.round(sec/60)+' min';const m=Math.floor(sec/60),s=Math.round(sec%60);return m?(s?`${m} min ${s} s`:`${m} min`):`${s} s`;}

function applySeedProgram(d){const p=seedProgram();d.exercises=p.exercises;d.types=p.types;d.muscleGroups=seed().muscleGroups;d.combos=null;d.seedVersion=2;}
function knowFor(name){const n=String(name||'').toLowerCase();for(const [re,m,desc] of KNOW)if(re.test(n))return {muscles:m,desc};return null;}
function primaryOf(m){let b=null,bv=-1;for(const [k,v] of Object.entries(m||{}))if(v>bv){b=k;bv=v;}return b;}
function enrichExercise(x,gids){
  if(!x.muscles||typeof x.muscles!=='object'){
    const k=knowFor(x.name);const m=k?{...k.muscles}:{};
    Object.keys(m).forEach(g=>{if(!gids.has(g))delete m[g];});
    if(x.muscle&&gids.has(x.muscle)&&!m[x.muscle])m[x.muscle]=1;
    x.muscles=m;
  }
  if(x.desc==null){const k=knowFor(x.name);x.desc=k?k.desc:'';}
  if(x.base===undefined)x.base=(x.equip==='machine'&&x.step===7)?1:null;
  if(x.ladder===undefined)x.ladder=null;
  if(x.easier===undefined)x.easier=null;
  if(x.archived===undefined)x.archived=false;
  if(x.next===undefined)x.next=null;
  x.muscle=primaryOf(x.muscles)||x.muscle||'';
}
function normalize(d){
  const def=seed();
  d.settings=Object.assign({},def.settings,d.settings||{});
  const st=d.settings;
  ['muscleGroups','exercises','types','sessions'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=def[k];});
  if(!Array.isArray(d.combos))d.combos=null;
  d.types.forEach((t,i)=>{
    t.templates=t.templates||[];if(!t.color)t.color=PALETTE[i%PALETTE.length];if(t.pair==null)t.pair='';
    t.templates.forEach(p=>{p.items=p.items||[];if(p.note==null)p.note='';p.items.forEach(it=>{
      if(it.repsMin==null){const r=parseInt(it.reps)||10;it.repsMin=r;it.repsMax=r+2;}delete it.reps;if(it.core===undefined)it.core=true;});});
  });
  if((d.seedVersion||1)<2&&!d.sessions.length)applySeedProgram(d);
  const gids=new Set(d.muscleGroups.map(g=>g.id));
  /* Versio 6: levyt kokonaismäärinä (molemmat käsipainot yhteensä) */
  if(!Array.isArray(st.dbDiskCounts)){
    const occ={};(st.dbDisks||[]).forEach(w=>{const k=r2(+w);if(k>0)occ[k]=(occ[k]||0)+1;});
    st.dbDiskCounts=Object.entries(occ).map(([w,c])=>({w:+w,n:Math.max(4,2*c)})).sort((a,b)=>a.w-b.w);
  }
  delete st.dbDisks;delete st.handWeights;delete st.easyCount;delete st.windowDays;
  if(!Array.isArray(st.ratioRules))st.ratioRules=(gids.has('takareisi')&&gids.has('etureisi'))?[{a:'takareisi',b:'etureisi',k:1}]:[];
  const firstV6=!d.schema||d.schema<6;
  d.muscleGroups.forEach(g=>{if(g.min===undefined)g.min=null;if(g.max===undefined)g.max=null;});
  if(firstV6){const fe=d.muscleGroups.find(g=>g.id==='etureisi');if(fe&&fe.max==null)fe.max=6;}
  d.exercises.forEach(x=>enrichExercise(x,gids));
  if(firstV6)d.types.forEach(t=>{if(t.templates.some(p=>p.items.length))t.templates=t.templates.filter(p=>p.items.length);});
  if(d.combos==null){
    d.combos=[];const q=d.types.find(t=>t.id==='t_quick'),s=d.types.find(t=>t.id==='t_short');
    if(q&&s&&q.templates[0]&&s.templates[0])d.combos.push({id:'c_pika_lyhyt',name:'Pika + lyhyt',parts:[{typeId:q.id,tplId:q.templates[0].id},{typeId:s.id,tplId:s.templates[0].id}]});
  }
  d.schema=6;
  return d;
}
function normDraft(d){
  if(!d)return null;
  (d.exercises||[]).forEach(e=>{e.sets.forEach(s=>{if(s.rating===undefined)s.rating=(e.collapsed&&e.rating)||null;if(s.t===undefined)s.t=null;});if(e.part==null)e.part=0;});
  if(d.kind==='full'&&!d.parts&&!d.editing)d.parts=[{typeId:d.typeId,typeName:d.typeName,templateId:d.templateId,templateName:d.templateName}];
  return d;
}

function occurrences(exId,n){const o=[];for(const s of sortedSessions()){const e=(s.exercises||[]).find(e=>e.exId===exId);if(e){o.push({date:s.date,e});if(o.length>=n)break;}}return o;}
function chainOf(exId){
  let root=exId,x=exById(exId);const seen=new Set([exId]);
  while(x&&x.easier&&exById(x.easier)&&!seen.has(x.easier)){root=x.easier;seen.add(root);x=exById(root);}
  const out=[root],inn=new Set(out);let cur=root;
  for(let g=0;g<50;g++){const h=S.exercises.find(e=>e.easier===cur&&!inn.has(e.id));if(!h)break;out.push(h.id);inn.add(h.id);cur=h.id;}
  if(!out.includes(exId))out.push(exId);
  return out;
}

/* ---------- painot ---------- */
const nDbOf=ex=>ex&&ex.equip==='dumbbell1'?1:2;
const isDb=ex=>ex&&(ex.equip==='dumbbell'||ex.equip==='dumbbell1');
/* Käsipainot: levyjä on rajallinen määrä yhteensä. Pari = sama kuorma molempiin käsipainoihin (4 levyä per koko per levy/puoli), yksi = 2 levyä. */
function dbMap(nDb){
  const st=S.settings,sizes=(st.dbDiskCounts||[]).filter(d=>d.w>0&&d.n>0),handle=st.dbHandle||0,res=new Map(),maxSide=st.dbMaxPerSide||99;
  const lim=sizes.map(d=>Math.min(6,Math.floor(d.n/(2*nDb))));
  const rec=(i,used)=>{
    if(i===sizes.length){
      if(!used.length&&!st.dbBarOnly)return;
      const w=r2(handle+2*used.reduce((a,b)=>a+b,0));
      if(!res.has(w)||res.get(w).length>used.length)res.set(w,[...used].sort((a,b)=>b-a));
      return;}
    for(let k=0;k<=lim[i]&&used.length+k<=maxSide;k++)rec(i+1,used.concat(Array(k).fill(sizes[i].w)));
  };
  rec(0,[]);
  return new Map([...res.entries()].sort((a,b)=>a[0]-b[0]));
}
function diskText(w,ex){const u=dbMap(nDbOf(ex)).get(w);if(!u)return '';return u.length?'levyt puolelle: '+u.map(fmt).join(' + '):'pelkkä kahva';}
function weightList(ex){
  if(!ex)return null;
  if(isDb(ex))return [...dbMap(nDbOf(ex)).keys()];
  if(ex.ladder&&ex.ladder.length)return [...ex.ladder].sort((a,b)=>a-b);
  return null;
}
/* Seuraava/edellinen paino laitteen portaissa: lista tai aloituspaino + askel. Palauttaa null, jos askelta ei ole. */
function stepW(ex,cur,dir){
  const L=weightList(ex);
  if(L){if(!L.length)return null;
    if(cur==null)return dir>0?L[0]:null;
    return dir>0?(L.find(w=>w>cur+1e-9)??null):([...L].reverse().find(w=>w<cur-1e-9)??null);}
  const step=(ex&&ex.step)||S.settings.gymStep||0.5,base=(ex&&ex.base)||0;
  if(cur==null)return dir>0?(base>0?base:step):null;
  const k=(cur-base)/step;
  const nk=dir>0?Math.floor(k+1e-9)+1:Math.ceil(k-1e-9)-1;
  if(nk<0)return null;
  return r2(base+nk*step);
}
const nextWeight=(ex,cur)=>stepW(ex,cur>0?cur:null,1);
function ladderText(x){
  const L=weightList(x);
  if(L)return L.length?'Portaat: '+L.map(fmt).join(', ')+' kg':'Ei painoja';
  const step=x.step||S.settings.gymStep||0.5,base=x.base||0,v=[];
  for(let k=0;k<8;k++)v.push(fmt(r2(base+(base>0?k:k+1)*step)));
  return 'Portaat: '+v.join(', ')+' … kg';
}
function weightsDesc(x){
  if(isDb(x))return `${EQUIP[x.equip].toLowerCase()}: ${[...dbMap(nDbOf(x)).keys()].map(fmt).join(', ')} kg`;
  if(x.equip==='bodyweight')return 'kehonpaino'+(x.step?`, lisäpainon askel ${fmt(x.step)} kg`:'');
  if(x.ladder&&x.ladder.length)return 'portaat '+x.ladder.map(fmt).join(', ')+' kg';
  return `aloitus ${fmt(x.base||0)} kg, askel ${fmt(x.step||S.settings.gymStep)} kg`;
}

function rangeFor(exId){
  for(const t of S.types)for(const p of t.templates){const it=p.items.find(i=>i.exId===exId);if(it)return [it.repsMin,it.repsMax];}
  return [S.settings.repsMin,S.settings.repsMax];
}
/* Kaksoisprogressio sarjakohtaisilla arvioilla:
   - paino nousee, kun kaikki sarjat yltävät ylärajaan eikä yksikään sarja ole raskas
   - jos viimeinen sarja on ollut raskas N kertaa peräkkäin, paino ja toistot pidetään */
function hintFor(exId,rmin,rmax,nSets){
  const ex=exById(exId);if(!ex)return null;
  if(ex.next){const n=ex.next,parts=[];if(n.weight!=null)parts.push(fmt(n.weight)+' kg');if(n.reps!=null)parts.push(n.reps+' toistoa');
    return {type:'coach',text:`${n.src==='coach'?'Valmennus':'Oma tavoite'}${n.at?' '+fmtDM(n.at):''}: ${parts.join(' × ')||'katso perustelu'}${n.note?' – '+n.note:''}`};}
  const hc=S.settings.heavyCount||0;
  const occ=occurrences(exId,Math.max(2,hc));
  if(!occ.length){
    const ch=chainOf(exId),i=ch.indexOf(exId);
    for(let k=i-1;k>=0;k--){const o=occurrences(ch[k],1)[0];if(o)return {type:'info',text:`Uusi vaihe ketjussa. Edellinen vaihe ${exById(ch[k]).name} ${fmtDay(o.date)}: ${setsText(o.e.sets)}. Aloita alarajalta ${rmin}.`};}
    return null;
  }
  const lastSetR=o=>{const s=o.e.sets[o.e.sets.length-1];return s?sr(s,o.e):null;};
  if(hc>0&&occ.length>=hc&&occ.slice(0,hc).every(o=>lastSetR(o)==='heavy'))
    return {type:'hold',text:`Viimeinen sarja on ollut raskas ${hc} kertaa peräkkäin – pidä paino ja toistot ennallaan.`};
  const evalO=o=>{const cur=Math.max(0,...o.e.sets.map(s=>s.weight||0));const at=o.e.sets.filter(s=>(s.weight||0)>=cur-1e-9);
    return {cur,at,success:at.length>=nSets&&at.every(s=>s.reps>=rmax),heavy:at.some(s=>sr(s,o.e)==='heavy'),allEasy:o.e.sets.length>0&&o.e.sets.every(s=>sr(s,o.e)==='easy')};};
  const L=evalO(occ[0]);const reps=L.at.map(s=>s.reps).join('/');const wTxt=L.cur?` @ ${fmt(L.cur)} kg`:'';
  if(L.success){
    if(L.heavy)return {type:'hold',text:`Yläraja ${rmax} saavutettu (${reps}${wTxt}), mutta jokin sarja tuntui raskaalta – toista sama paino.`};
    if(rmin===rmax&&occ.length>=2){const P=evalO(occ[1]);
      if(L.allEasy&&P.success&&P.allEasy){const nm=rmin<=6?rmin+3:Math.round(rmin*1.5);
        return {type:'range',text:`Kiinteä ${nSets} × ${rmin} on mennyt helposti kahdesti. Laajenna toistoalue ${rmin}–${nm} ja lisää toistoja ennen painon nostoa.`,newMax:nm};}}
    const bw=ex.equip==='bodyweight'&&!L.cur;
    const nx=bw?null:nextWeight(ex,L.cur);
    if(nx!=null){const dt=isDb(ex)?diskText(nx,ex):'';
      return {type:'up',text:`Kaikki sarjat ylärajalla (${reps}${wTxt}) – nosta painoon ${fmt(nx)} kg ja aloita ${rmin} toistosta${dt?' ('+dt+')':''}.`,weight:nx,reps:rmin};}
    const h=harderOf(exId);
    if(h)return {type:'chain',text:`Yläraja ${rmax} saavutettu – siirry vaikeampaan versioon: ${h.name}.`,to:h.id};
    return {type:'up',text:bw?`Yläraja ${rmax} saavutettu – lisää sarja tai luo vaikeampi versio liikepankissa.`:'Yläraja saavutettu, mutta raskaampaa painoa ei ole – lisää sarja tai hidasta tempoa.'};
  }
  if(L.at.some(s=>s.reps<rmin))return {type:'hold',text:`Viimeksi ${reps}${wTxt} – osa sarjoista jäi alle ${rmin} toiston. Pidä paino ennallaan.`};
  return {type:'info',text:`Viimeksi ${reps}${wTxt} – lisää toistoja samalla painolla kohti ${rmax}:ää.`};
}
function setsText(sets){
  if(!sets||!sets.length)return '–';
  const hasW=s=>s.weight!=null&&s.weight!=='';
  const parts=sets.map(s=>hasW(s)?`${s.reps}×${fmt(s.weight)}`:`${s.reps}`);
  if(parts.every(p=>p===parts[0])){const s=sets[0];return `${sets.length}×${s.reps}${hasW(s)?' @ '+fmt(s.weight)+' kg':''}`;}
  return parts.join(', ')+(sets.some(hasW)?' kg':'');
}
function sessionSummary(s){
  if(s.kind==='tick')return '✓ Tehty';
  if(s.kind==='activity'){const p=[];if(s.durationMin!=null)p.push(fmt(s.durationMin)+' min');if(s.distanceKm!=null)p.push(fmt(s.distanceKm)+' km');return (p.join(' · ')||'Kirjattu')+(s.rating?' · '+RATE[s.rating].toLowerCase():'');}
  const sets=(s.exercises||[]).reduce((a,e)=>a+e.sets.length,0);
  return `${(s.exercises||[]).length} liikettä · ${sets} sarjaa`;
}
function sessionTitle(s){return s.typeName+(s.templateName&&s.templateName!==s.typeName?' – '+s.templateName:'');}
function sessSpan(s){const ts=[];(s.exercises||[]).forEach(e=>e.sets.forEach(st=>{if(st.t)ts.push(Date.parse(st.t));}));if(!ts.length)return null;ts.sort((a,b)=>a-b);return {a:ts[0],b:ts[ts.length-1],min:Math.round((ts[ts.length-1]-ts[0])/60000)};}

/* ---------- lihasryhmät ---------- */
function weightedCounts(ws){
  const c={};
  S.sessions.filter(s=>weekStart(s.date)===ws).forEach(s=>(s.exercises||[]).forEach(e=>{const n=e.sets.length;for(const [g,w] of Object.entries(musclesOf(e)))c[g]=(c[g]||0)+n*w;}));
  Object.keys(c).forEach(k=>c[k]=Math.round(c[k]*10)/10);
  return c;
}
function balanceIssues(c,final){
  const out=[];
  S.muscleGroups.forEach(g=>{const v=c[g.id]||0;
    if(g.max!=null&&v>g.max)out.push({lv:'over',g:g.id,text:`${g.name} ${fmt(v)} sarjaa – yli enimmäismäärän ${fmt(g.max)}`});
    if(final&&g.min!=null&&v<g.min)out.push({lv:'under',g:g.id,text:`${g.name} ${fmt(v)} sarjaa – alle vähimmäismäärän ${fmt(g.min)}`});});
  (S.settings.ratioRules||[]).forEach(r=>{const a=c[r.a]||0,b=c[r.b]||0;
    if(b>0&&a<r.k*b-1e-9)out.push({lv:'ratio',g:r.a,text:`${mgName(r.a)} ${fmt(a)} : ${mgName(r.b).toLowerCase()} ${fmt(b)} – tavoite ${mgName(r.a).toLowerCase()} vähintään ${r.k===1?'':fmt(r.k)+' × '}${mgName(r.b).toLowerCase()}`});});
  return out;
}
function exercisesFor(g){
  const names=[];S.types.forEach(t=>t.templates.forEach(p=>p.items.forEach(i=>{const x=exById(i.exId);if(x&&(x.muscles[g]||0)>=1){const n=`${x.name} (${p.name})`;if(!names.includes(n))names.push(n);}})));
  return names.slice(0,3);
}

/* ---------- treenin aloitus ---------- */
function buildEx(exId,it,part){
  const ex=exById(exId),lo=occurrences(exId,1)[0];
  const n=(it&&it.sets)||(lo?lo.e.sets.length:3);
  const [rmin,rmax]=it&&it.repsMin!=null?[it.repsMin,it.repsMax]:rangeFor(exId);
  const nx=ex&&ex.next;const sets=[];
  for(let j=0;j<n;j++){
    const ls=lo?(lo.e.sets[j]||lo.e.sets[lo.e.sets.length-1]):null;
    let reps=ls?ls.reps:rmin,w=ls?ls.weight:(it?it.weight:'');
    if(nx){if(nx.reps!=null)reps=nx.reps;if(nx.weight!=null)w=nx.weight;}
    sets.push({reps:String(reps??rmin),weight:fmtIn(w),rating:null,t:null});
  }
  return {exId,name:ex?ex.name:'?',muscle:ex?ex.muscle:'',sets,rmin,rmax,core:it?it.core!==false:true,part:part||0,
    last:lo?{date:lo.date,sets:lo.e.sets,rating:lo.e.rating||null}:null,hint:hintFor(exId,rmin,rmax,n)};
}
const tplItems=(tpl,hurry)=>tpl.items.filter(it=>exById(it.exId)&&(!hurry||it.core!==false));
function confirmDrop(){return !draft||confirm(draft.editing?'Kirjauksen muokkaus on kesken. Hylätäänkö muutokset?':'Toinen treeni on kesken. Hylätäänkö se?');}
function openSession(){saveDraft();closeModal();view.tab='session';render();scrollTo(0,0);}
function startSession(typeId,tplId,hurry){
  const ty=typeById(typeId);if(!ty)return;
  if(!confirmDrop())return;
  if(ty.logStyle==='tick'){draft=null;saveDraft();addTick(ty);return;}
  if(ty.logStyle==='activity'){
    draft={kind:'activity',typeId:ty.id,typeName:ty.name,date:ymd(),durationMin:'',distanceKm:'',rating:null,note:''};
  }else{
    const tpl=ty.templates.find(p=>p.id===tplId)||ty.templates[0];
    if(!tpl){alert('Tällä treenityypillä ei ole vielä pohjaa. Lisää se Suunnitelma-sivulla.');return;}
    draft={kind:'full',typeId:ty.id,typeName:ty.name,templateId:tpl.id,templateName:tpl.name,templateNote:tpl.note||'',hurry:!!hurry,date:ymd(),note:'',
      parts:[{typeId:ty.id,typeName:ty.name,templateId:tpl.id,templateName:tpl.name}],
      exercises:tplItems(tpl,hurry).map(it=>buildEx(it.exId,it,0))};
  }
  openSession();
}
function startCombo(id,hurry){
  const c=(S.combos||[]).find(c=>c.id===id);if(!c)return;
  if(!confirmDrop())return;
  const parts=[],exs=[],seen=new Set(),notes=[];
  c.parts.forEach(p=>{const ty=typeById(p.typeId);if(!ty)return;const tpl=ty.templates.find(t=>t.id===p.tplId)||ty.templates[0];if(!tpl)return;
    const pi=parts.length;parts.push({typeId:ty.id,typeName:ty.name,templateId:tpl.id,templateName:tpl.name});if(tpl.note)notes.push(tpl.note);
    tplItems(tpl,hurry).forEach(it=>{if(seen.has(it.exId))return;seen.add(it.exId);exs.push(buildEx(it.exId,it,pi));});});
  if(!parts.length){alert('Yhdistelmän osia ei löydy. Tarkista yhdistelmä Suunnitelma-sivulla.');return;}
  draft={kind:'full',combo:{id:c.id,name:c.name},typeId:parts[0].typeId,typeName:c.name,templateId:parts[0].templateId,templateName:'',templateNote:notes.join(' · '),hurry:!!hurry,date:ymd(),note:'',parts,exercises:exs};
  openSession();
}
function addTick(ty){
  S.sessions.push({id:uid(),createdAt:Date.now(),date:ymd(),typeId:ty.id,typeName:ty.name,kind:'tick',note:''});
  save();closeModal();render();toast(ty.name+' merkitty tehdyksi');
}
function packEx(e){return {exId:e.exId,name:e.name,muscle:e.muscle,sets:e.sets.map(s=>({reps:num(s.reps),weight:num(s.weight),rating:s.rating||null,t:s.t||null})).filter(s=>s.reps!=null&&s.reps>0)};}
function finishSession(){
  const d=draft,date=d.date||ymd(),note=(d.note||'').trim();
  if(d.editing){
    const s=S.sessions.find(x=>x.id===d.editing);if(!s){alert('Muokattavaa kirjausta ei löydy.');return;}
    if(d.kind==='full'){const ex=d.exercises.map(packEx).filter(e=>e.sets.length);if(!ex.length){alert('Yhtään sarjaa ei ole kirjattu. Poista kirjaus, jos haluat sen pois.');return;}s.exercises=ex;}
    if(d.kind==='activity'){s.durationMin=num(d.durationMin);s.distanceKm=num(d.distanceKm);s.rating=d.rating||null;}
    s.date=date;s.note=note;s.editedAt=Date.now();
    save();draft=null;saveDraft();view.tab='history';view.hsub='sessions';render();scrollTo(0,0);toast('Muutokset tallennettu');return;
  }
  if(d.kind==='activity'){
    const base={id:uid(),createdAt:Date.now(),date,typeId:d.typeId,typeName:d.typeName,kind:'activity',note,durationMin:num(d.durationMin),distanceKm:num(d.distanceKm),rating:d.rating||null};
    if(base.durationMin==null&&base.distanceKm==null&&!confirm('Kestoa tai matkaa ei ole syötetty. Tallennetaanko silti?'))return;
    S.sessions.push(base);
  }else{
    const now=Date.now(),out=[];
    draftParts(d).forEach((p,pi)=>{
      const ex=d.exercises.filter(e=>(e.part||0)===pi).map(packEx).filter(e=>e.sets.length);
      if(!ex.length)return;
      const s={id:uid(),createdAt:now+pi,date,typeId:p.typeId,typeName:p.typeName,kind:'full',note:'',templateId:p.templateId,templateName:p.templateName,exercises:ex};
      if(d.combo)s.combo=d.combo.name;if(d.hurry)s.hurry=true;
      out.push(s);});
    if(!out.length){alert('Yhtään sarjaa ei ole kirjattu.');return;}
    out[0].note=note;
    out.forEach(s=>s.exercises.forEach(e=>{const x=exById(e.exId);if(x&&x.next)x.next=null;}));
    S.sessions.push(...out);
  }
  save();draft=null;saveDraft();view.tab='today';render();scrollTo(0,0);toast('Treeni tallennettu');
}
function editSession(id){
  const s=S.sessions.find(x=>x.id===id);if(!s)return;
  if(!confirmDrop())return;
  draft={editing:s.id,kind:s.kind,typeId:s.typeId,typeName:s.typeName,templateId:s.templateId,templateName:s.templateName,date:s.date,note:s.note||''};
  if(s.kind==='activity')Object.assign(draft,{durationMin:fmtIn(s.durationMin),distanceKm:fmtIn(s.distanceKm),rating:s.rating||null});
  if(s.kind==='full')draft.exercises=s.exercises.map(e=>{const [rmin,rmax]=rangeFor(e.exId);return {exId:e.exId,name:e.name,muscle:e.muscle,rmin,rmax,core:true,part:0,last:null,hint:null,collapsed:true,
    sets:e.sets.map(st=>({reps:String(st.reps??''),weight:fmtIn(st.weight),rating:st.rating||e.rating||null,t:st.t||null}))};});
  openSession();
}

/* ---------- näkymä: tänään ---------- */
function exportBanner(){
  if(!S.sessions.length)return '';
  const le=S.settings.lastExport;const days=le?daysBetween(le.slice(0,10),ymd()):null;
  if(le&&days<=7)return '';
  return `<div class="card warn"><b>${le?`Edellisestä varmuuskopiosta on ${days} päivää`:'Varmuuskopiota ei ole vielä tehty'}</b>
    <p class="small">Tiedot ovat vain tässä puhelimessa. Tallenna varmuuskopio, jottei historia katoa välimuistin tyhjennyksessä.</p>
    <div class="row"><button class="btn primary small" data-act="exportjson">Tallenna varmuuskopio</button></div></div>`;
}
function weekStrip(){
  const t=ymd(),ws=weekStart(t);let h='<div class="week" aria-label="Tämä viikko">';const used=new Set();
  for(let i=0;i<7;i++){
    const d=addDays(ws,i),dow=parseYmd(d).getDay();
    const ss=S.sessions.filter(s=>s.date===d).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    const fx=S.types.filter(x=>x.schedule==='fixed'&&x.weekday===dow&&!ss.some(s=>s.typeId===x.id));
    ss.forEach(s=>used.add(s.typeId));fx.forEach(x=>used.add(x.id));
    const marks=ss.map(s=>`<i style="background:${typeColor(s.typeId)}" title="${esc(s.typeName)}"></i>`).join('')+fx.map(x=>`<i class="plan" style="color:${x.color}" title="${esc(x.name)} (suunniteltu)"></i>`).join('');
    h+=`<div class="wd${d===t?' today':''}${d>t?' future':''}"><span>${WD[dow]}</span><b>${parseYmd(d).getDate()}</b><div class="marks">${marks}</div></div>`;
  }
  h+='</div>';
  const lg=S.types.filter(x=>used.has(x.id));
  if(lg.length)h+=`<div class="legend">${lg.map(x=>`<span><i class="cdot" style="background:${x.color}"></i>${esc(x.name)}</span>`).join('')}</div>`;
  return h;
}
function tplButtons(ty,p,cls,label){
  const opt=p.items.filter(i=>i.core===false).length,n=p.items.length-opt;
  return `<button class="btn ${cls}" data-act="start" data-type="${ty.id}" data-tpl="${p.id}">${esc(label)}</button>`+(opt&&n?`<button class="btn ${cls} alt" data-act="start" data-type="${ty.id}" data-tpl="${p.id}" data-hurry="1">Kiire (${n})</button>`:'');
}
function startButtons(ty,cls){
  if(ty.logStyle==='tick')return `<button class="btn ${cls}" data-act="start" data-type="${ty.id}">Merkitse tehdyksi</button>`;
  if(ty.logStyle==='activity')return `<button class="btn ${cls}" data-act="start" data-type="${ty.id}">Kirjaa</button>`;
  if(!ty.templates.length)return `<span class="small muted">Ei treenipohjaa</span>`;
  if(ty.templates.length===1)return tplButtons(ty,ty.templates[0],cls,cls==='small'?'Aloita':'Aloita treeni');
  return ty.templates.map(p=>`<button class="btn ${cls}" data-act="start" data-type="${ty.id}" data-tpl="${p.id}">${esc(p.name)}</button>`).join('');
}
function comboButtons(c,cls){
  const items=[];c.parts.forEach(p=>{const ty=typeById(p.typeId);const tpl=ty&&(ty.templates.find(t=>t.id===p.tplId)||ty.templates[0]);if(tpl)items.push(...tpl.items);});
  const opt=items.filter(i=>i.core===false).length,n=items.length-opt;
  return `<button class="btn ${cls}" data-act="startcombo" data-id="${c.id}">Aloita</button>`+(opt&&n?`<button class="btn ${cls} alt" data-act="startcombo" data-id="${c.id}" data-hurry="1">Kiire (${n})</button>`:'');
}
function heroCard(ty,label){
  let meta='';
  if(ty.logStyle==='full'&&ty.templates.length===1){const p=ty.templates[0];const opt=p.items.filter(i=>i.core===false).length;
    meta=`${p.items.length} liikettä, ${p.items.reduce((a,i)=>a+(+i.sets||0),0)} sarjaa${opt?`, joista ${opt} valinnaista liikettä`:''}`;}
  else if(ty.logStyle==='full')meta='Valitse versio';
  else if(ty.logStyle==='tick')meta='Kuittaa, kun treeni on tehty';
  else meta='Kirjaa kesto ja matka';
  return `<div class="hero" style="--c:${ty.color}"><span class="tag">${esc(label)}</span><h2>${esc(ty.name)}</h2><p>${meta}</p><div class="row">${startButtons(ty,'')}</div></div>`;
}
function balanceCard(ws,dow){
  const c=weightedCounts(ws);const final=[5,6,0].includes(dow);
  const iss=balanceIssues(c,final);if(!iss.length)return '';
  return `<div class="card warn"><b>Lihastasapaino tällä viikolla</b><ul class="issues">${iss.map(i=>{

function hSummary(){

  for(let k=0;k<8;k++){
    const w=addDays(ws0,-7*k);const wk=S.sessions.filter(s=>weekStart(s.date)===w);
    const chips=[];let planned=0,done=0;
    S.types.forEach(ty=>{

    const iss=wk.length?balanceIssues(weightedCounts(w),k>0):[];
    h+=`<div class="card"><div class="between"><h3>Viikko ${isoWeek(w)}${k===0?' (tämä)':''}</h3><span class="muted small">${fmtDM(w)}–${fmtDM(addDays(w,6))}</span></div>

function chart(pts,unit,labels){
  const W=340,H=200,L=38,R=12,T=18,B=26;
  const vals=pts.map(p=>p.v);let mn=Math.min(...vals),mx=Math.max(...vals);
  if(mn===mx){mn=mn-1;mx=mx+1;}const pad=(mx-mn)*.12;mn=Math.max(0,mn-pad);mx=mx+pad;
  const x=i=>pts.length===1?(L+(W-L-R)/2):L+i*(W-L-R)/(pts.length-1);
  const y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let g='';
  for(let k=0;k<4;k++){const v=mn+(mx-mn)*k/3;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-5}" y="${y(v)+3}" text-anchor="end">${fmt(Math.round(v*10)/10)}</text>`;}
  let path='',lab='';
  pts.forEach((p,i)=>{const nw=i===0||p.m!==pts[i-1].m;path+=(nw?'M':'L')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)+' ';
    if(labels&&nw){const nm=labels[p.m]||'';lab+=`<text class="lab" x="${Math.min(x(i)+2,W-R-70)}" y="${Math.max(y(p.v)-9,T)}">${esc(nm.length>22?nm.slice(0,21)+'…':nm)}</text>`;}});
  const col={easy:'var(--easy)',medium:'var(--med)',heavy:'var(--heavy)'};
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="5" fill="${col[p.r]||'var(--none)'}" stroke="var(--card)" stroke-width="1.5"/>`).join('');
  const xl=`<text x="${x(0)}" y="${H-8}" text-anchor="${pts.length===1?'middle':'start'}">${fmtDM(pts[0].d)}</text>`+(pts.length>1?`<text x="${x(pts.length-1)}" y="${H-8}" text-anchor="end">${fmtDM(pts[pts.length-1].d)}</text>`:'');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Kehitys">${g}<path class="ln" d="${path}"/>${dots}${lab}${xl}<text x="${L}" y="${T-6}">${unit}</text></svg>`;
}

function hMuscles(){

  return h;

function matchEx(it){

  const n=normName(it.nimi||it.name);if(!n)return null;
  return S.exercises.find(x=>normName(x.name)===n)||S.exercises.find(x=>!x.archived&&normName(x.name).startsWith(n))||null;
}
function coachTarget(o){
  const it=o.it,x=o.x;let w=num(it.paino);

  const r=it.toistot!=null?parseInt(it.toistot):null;
  return {w,r:Number.isFinite(r)?r:null,skip};
}

        ${x?'':'<div class="small err">Liikettä ei löydy sovelluksesta – tarkista tunniste tai nimi.</div>'}
        ${lines.map(l=>`<div class="small">${l}</div>`).join('')}${it.perustelu?`<div class="small muted">${esc(it.perustelu)}</div>`:''}</div></div>`;}).join('')+`</div>`;}
  if(mt.length){h+=`<h2>Lihastavoitteet</h2><div class="card">`+mt.map((o,i)=>`<div class="pick"><input type="checkbox" data-change="coachpick" data-k="mt" data-i="${i}"${o.on?' checked':''}${o.g?'':' disabled'}><div class="grow"><b>${esc(o.g?o.g.name:o.t.ryhma)}</b><div class="small">${'min' in o.t?'min '+(o.t.min==null?'ei rajaa':fmt(o.t.min))+' ':''}${'max' in o.t?'max '+(o.t.max==null?'ei rajaa':fmt(o.t.max)):''}</div>${o.g?'':'<div class="small err">Lihasryhmää ei löydy.</div>'}</div></div>`).join('')+`</div>`;}
  h+=`<div class="row"><button class="btn primary" id="coachbtn" data-act="coachapply">${coachBtnLabel()}</button><button class="btn" data-act="closemodal">Peru</button></div>`;
  openModal(h);
}
function coachBtnLabel(){const p=pendingCoach;if(!p)return '';const n=p.items.filter(o=>o.on&&o.x).length+p.mt.filter(o=>o.on&&o.g).length;return `Ota käyttöön (${n})`;}
function applyCoach(){
  const p=pendingCoach;if(!p)return;const at=p.d.pvm||ymd();let n=0;
  p.items.forEach(o=>{if(!o.on||!o.x)return;const it=o.it,x=o.x,{w,r}=coachTarget(o);
    if(w!=null||r!=null)x.next={weight:w,reps:r,note:String(it.perustelu||''),src:'coach',at};
    const ra=Array.isArray(it.toistoalue)&&it.toistoalue.length===2?it.toistoalue.map(v=>parseInt(v)):null,sets=it.sarjat!=null?parseInt(it.sarjat):null;
    if(ra||sets>0)S.types.forEach(t=>t.templates.forEach(pp=>pp.items.forEach(i=>{if(i.exId!==x.id)return;if(ra&&ra.every(Number.isFinite)){i.repsMin=Math.min(...ra);i.repsMax=Math.max(...ra);}if(sets>0)i.sets=sets;})));
    n++;});
  p.mt.forEach(o=>{if(!o.on||!o.g)return;if('min' in o.t)o.g.min=o.t.min==null?null:num(o.t.min);if('max' in o.t)o.g.max=o.t.max==null?null:num(o.t.max);n++;});
  pendingCoach=null;save();closeModal();render();toast(`Valmennus otettu käyttöön (${n} muutosta)`);
}
function handleImportText(txt){
  let d;try{d=JSON.parse(txt);}catch(e){alert('Tiedosto ei ole kelvollista JSONia.');return;}
  if(d&&(d.muoto==='treeni-valmennus'||d.format==='treeni-valmennus')){previewCoach(d);return;}
  if(d&&Array.isArray(d.types)&&Array.isArray(d.sessions)){
    if(!confirm(`Varmuuskopiossa on ${d.sessions.length} kirjausta${d.exportedAt?' ('+d.exportedAt.slice(0,10)+')':''}. Korvataanko nykyiset tiedot?`))return;
    delete d.exportedAt;S=normalize(d);save();view.sub=null;render();toast('Tiedot palautettu');return;
  }
  alert('Tuntematon tiedosto. Odotettiin varmuuskopiota tai valmennustiedostoa ("muoto": "treeni-valmennus").');
}

/* ---------- näkymä: suunnitelma ---------- */
function schedDesc(ty){
  let s=ty.schedule==='fixed'?`Kiinteä · ${WD_EVERY[ty.weekday]}`:ty.schedule==='flexible'?`Joustava · ${ty.quota}× viikossa`:'Satunnainen';
  if(ty.schedule==='flexible'&&ty.pair){const [m,id]=ty.pair.split(':');const o=typeById(id);if(o)s+=m==='with'?` · ${o.name.toLowerCase()}päivinä`:` · päivinä ilman: ${o.name.toLowerCase()}`;}
  return s+' · '+LOG[ty.logStyle].toLowerCase();
}
function exMeta(x){
  const p=[EQUIP[x.equip]||''];
  if(x.equip==='machine'||x.equip==='free'){if(x.ladder&&x.ladder.length)p.push('portaat '+x.ladder.slice(0,4).map(fmt).join('/')+(x.ladder.length>4?'…':''));else if(x.step||x.base)p.push(`${x.base?fmt(x.base)+' + ':''}askel ${fmt(x.step||S.settings.gymStep)} kg`);}
  const ch=chainOf(x.id);if(ch.length>1)p.push(`ketju ${ch.indexOf(x.id)+1}/${ch.length}`);
  return p.join(' · ');
}
function tplOptions(sel){
  return S.types.filter(t=>t.logStyle==='full').flatMap(t=>t.templates.map(p=>{const v=t.id+'|'+p.id;return `<option value="${v}"${v===sel?' selected':''}>${esc(t.name+(p.name!==t.name?' – '+p.name:''))}</option>`;})).join('');
}

    `</div><button class="btn block" data-act="newtype">+ Uusi treenityyppi</button>`;
  h+=`<h2>Yhdistelmätreenit</h2><p class="small muted">Yhdistelmä näkyy Tänään-sivulla, kun jokaisella osalla on viikkokiintiötä jäljellä. Tallennus kirjaa jokaisen osan omaksi treenikseen, joten molempien kiintiöt täyttyvät.</p>`;
  (S.combos||[]).forEach(c=>{
    h+=`<div class="tplbox"><div class="between"><input data-bind="combo" data-id="${c.id}" data-f="name" value="${esc(c.name)}" style="font-weight:700" aria-label="Yhdistelmän nimi"><button class="x" data-act="combodel" data-id="${c.id}" aria-label="Poista yhdistelmä">🗑</button></div>`+
      c.parts.map((p,i)=>`<div class="between" style="margin-top:8px"><select data-bind="combopart" data-id="${c.id}" data-i="${i}" aria-label="Osa ${i+1}">${tplOptions(p.typeId+'|'+p.tplId)}</select><button class="x" data-act="combodelpart" data-id="${c.id}" data-i="${i}" aria-label="Poista osa">×</button></div>`).join('')+
      `<button class="btn small" style="margin-top:8px" data-act="comboaddpart" data-id="${c.id}">+ Osa</button></div>`;
  });
  h+=`<button class="btn block" data-act="combonew">+ Uusi yhdistelmä</button><h2>Liikepankki</h2>`;
  const act=S.exercises.filter(x=>!x.archived),arch=S.exercises.filter(x=>x.archived);
  const known=new Set(S.muscleGroups.map(g=>g.id));
  const row=x=>`<div class="listrow" data-act="openex" data-id="${x.id}"><div class="grow">${esc(x.name)}<div class="small muted">${esc(exMeta(x))}</div></div>${x.next?'<span class="chip ok">Tavoite</span>':''}<span class="chev">›</span></div>`;
  [...S.muscleGroups,{id:null,name:'Muu'}].forEach(g=>{
    const xs=act.filter(x=>g.id===null?!known.has(x.muscle):x.muscle===g.id).sort(byName);
    if(xs.length)h+=`<div class="card"><p class="small muted" style="margin-top:0">${esc(g.name)}</p>${xs.map(row).join('')}</div>`;

  if(arch.length)h+=`<details class="card"><summary>Arkistoidut liikkeet (${arch.length})</summary>${arch.sort(byName).map(row).join('')}</details>`;
  return h;

  if(ty.logStyle==='full'){

    ty.templates.forEach(p=>{
      h+=`<div class="tplbox"><div class="between"><input data-bind="tpl" data-ty="${ty.id}" data-tpl="${p.id}" data-f="name" value="${esc(p.name)}" style="font-weight:700" aria-label="Pohjan nimi"><button class="x" data-act="deltpl" data-ty="${ty.id}" data-tpl="${p.id}" aria-label="Poista pohja">🗑</button></div>
        <label>Ohje / lämmittely (ei lasketa sarjoihin)<input data-bind="tpl" data-ty="${ty.id}" data-tpl="${p.id}" data-f="note" value="${esc(p.note||'')}" placeholder="Esim. 5 min soutu"></label>
        ${p.items.length?'':'<p class="small err">Tyhjä pohja – lisää liikkeitä tai poista pohja.</p>'}`;

        h+=`<div class="itemrow"><div class="between"><select data-bind="item" ${a} data-f="exId" aria-label="Liike">${exOptions(it.exId)}</select>

          <input data-bind="item" ${a} data-f="repsMin" inputmode="numeric" value="${esc(it.repsMin)}" aria-label="Toistot vähintään"><span class="u">–</span>
          <input data-bind="item" ${a} data-f="repsMax" inputmode="numeric" value="${esc(it.repsMax)}" aria-label="Toistot enintään"><span class="u">toist.</span>

/* ---------- vienti ---------- */
async function shareOrDownload(name,text,mime){
  const file=new File([text],name,{type:mime});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});return true;}catch(e){if(e.name==='AbortError')return false;}
  }
  const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
  return true;
}
async function exportJson(){
  const stamp=new Date();const data=JSON.parse(JSON.stringify(S));data.exportedAt=stamp.toISOString();
  const ok=await shareOrDownload(`treeni-varmuuskopio-${ymd(stamp)}.json`,JSON.stringify(data,null,1),'application/json');
  if(ok){S.settings.lastExport=ymd(stamp)+'T'+z(stamp.getHours())+':'+z(stamp.getMinutes());save();render();toast('Varmuuskopio tallennettu');}
}
function flatRows(){
  const dec=n=>n==null?'':String(n).replace('.',',');
  const rows=[['pvm','viikko','treenityyppi','pohja','yhdistelmä','liike','lihasryhmä','sarja','toistot','paino_kg','tuntuma','aika','tauko_s','kesto_min','matka_km','muistiinpano']];
  [...S.sessions].sort(byT).forEach(s=>{
    const base=[s.date,isoWeek(s.date),s.typeName,s.templateName||'',s.combo||''];
    if(s.kind==='full'){
      const ts=[];s.exercises.forEach(e=>e.sets.forEach(st=>{if(st.t)ts.push(Date.parse(st.t));}));ts.sort((a,b)=>a-b);
      let first=true;
      s.exercises.forEach(e=>e.sets.forEach((st,j)=>{const t=st.t?Date.parse(st.t):null,prev=t?ts.filter(x=>x<t).pop():null;const r=sr(st,e);
        rows.push([...base,e.name,mgName((exById(e.exId)||e).muscle),j+1,st.reps,dec(st.weight),r?RATE[r]:'',t?hms(t):'',prev?Math.round((t-prev)/1000):'','','',first?s.note:'']);first=false;}));
    }else rows.push([...base,'','','','','',s.rating?RATE[s.rating]:'','','',dec(s.durationMin),dec(s.distanceKm),s.note||'']);
  });
  return rows;
}
function exportCsv(){
  const cell=v=>{v=String(v??'');return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  shareOrDownload(`treeni-taulukko-${ymd()}.csv`,'﻿'+flatRows().map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv');
}
async function copyText(txt,okMsg){
  try{await navigator.clipboard.writeText(txt);toast(okMsg);return true;}catch(e){return false;}
}
async function copyTsv(){
  const tsv=flatRows().map(r=>r.map(v=>String(v??'').replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');
  if(!(await copyText(tsv,'Taulukko kopioitu – liitä Sheetsiin')))openModal(`<div class="between"><h1>Kopioi taulukko</h1><button class="btn small ghost" data-act="closemodal">Sulje</button></div><p class="small muted">Valitse teksti ja kopioi.</p><textarea rows="12" readonly>${esc(tsv)}</textarea>`);
}
document.getElementById('importfile').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>handleImportText(String(r.result));r.readAsText(f);
});

/* ---------- kenttien sidonta ---------- */
function bind(el,isSelect){
  const b=el.dataset.bind,f=el.dataset.f,ds=el.dataset;let v=el.value;
  if(b==='d'){draft[f]=v;saveDraft();return;}
  if(b==='set'){const e=draft.exercises[+ds.ex],j=+ds.set,old=e.sets[j][f];e.sets[j][f]=v;if(f==='weight')fillDown(e,j,old,+ds.ex);saveDraft();return;}
  let rerender=isSelect;
  if(b==='ty'){
    const ty=typeById(ds.id);if(!ty)return;
    if(f==='weekday')ty.weekday=+v;else if(f==='quota')ty.quota=Math.max(0,parseInt(v)||0);else ty[f]=v;
    if(f==='logStyle'&&v==='full'&&!ty.templates.length)ty.templates.push({id:uid(),name:'Perus',note:'',items:[]});
  }else if(b==='tpl'){
    const p=typeById(ds.ty).templates.find(p=>p.id===ds.tpl);p[f]=v;
  }else if(b==='item'){
    const it=typeById(ds.ty).templates.find(p=>p.id===ds.tpl).items[+ds.i];
    if(f==='exId')it.exId=v;else if(f==='weight'){const n=num(v);it.weight=n==null?'':n;}else it[f]=Math.max(0,parseInt(v)||0);
  }else if(b==='exl'){
    const x=exById(ds.id);if(!x)return;
    if(f==='step')x.step=num(v)||null;
    else if(f==='base'){const n=num(v);x.base=n!=null&&n>=0?n:null;}
    else if(f==='ladder'){const L=v.split(/[;\s]+/).map(num).filter(n=>n!=null&&n>=0);x.ladder=L.length?[...new Set(L)].sort((a,b)=>a-b):null;}
    else if(f==='easier'){
      let c=v?exById(v):null,cyc=false;for(let g=0;c&&g<60;g++){if(c.id===x.id){cyc=true;break;}c=c.easier?exById(c.easier):null;}
      if(cyc){alert('Valinta tekisi ketjuun silmukan.');}else x.easier=v||null;
      rerender=true;
    }
    else x[f]=v;
    if(['step','base','ladder'].includes(f)){const p=document.getElementById('ladprev');if(p)p.textContent=ladderText(x);}
  }else if(b==='exm'){
    const x=exById(ds.id);const n=num(v);if(n&&n>0)x.muscles[ds.g]=n;else delete x.muscles[ds.g];x.muscle=primaryOf(x.muscles)||x.muscle;
  }else if(b==='exn'){
    const x=exById(ds.id);const n=x.next?{...x.next}:{weight:null,reps:null,note:''};
    if(f==='weight')n.weight=num(v);else if(f==='reps'){const r=parseInt(v);n.reps=Number.isFinite(r)?r:null;}else n.note=v;
    n.src='manual';n.at=ymd();x.next=(n.weight==null&&n.reps==null&&!n.note)?null:n;
  }else if(b==='combo'){
    const c=S.combos.find(c=>c.id===ds.id);if(c)c[f]=v;
  }else if(b==='combopart'){
    const c=S.combos.find(c=>c.id===ds.id);if(c){const [t,p]=v.split('|');c.parts[+ds.i]={typeId:t,tplId:p};}rerender=false;
  }else if(b==='mg'){
    const g=S.muscleGroups.find(g=>g.id===ds.id);if(!g)return;
    if(f==='name')g.name=v;else{const n=num(v);g[f]=n!=null&&n>=0?n:null;}
  }else if(b==='rr'){
    const r=S.settings.ratioRules[+ds.i];if(!r)return;if(f==='k'){const n=num(v);if(n&&n>0)r.k=n;}else r[f]=v;rerender=false;
  }else if(b==='disk'){
    const d=S.settings.dbDiskCounts[+ds.i];if(!d)return;
    if(f==='w'){const n=num(v);if(n&&n>0)d.w=n;}else{const n=parseInt(v);if(n>=0)d.n=n;}
    const hl=document.getElementById('hwlist');if(hl)hl.innerHTML=hwChips();
  }else if(b==='st'){
    const st=S.settings;
    if(f==='dbHandle'||f==='dbBarOnly'||f==='dbMaxPerSide'){
      if(f==='dbHandle'){const n=num(v);if(n!=null&&n>=0)st.dbHandle=n;}else if(f==='dbMaxPerSide'){const n=parseInt(v);if(n>0)st.dbMaxPerSide=n;}else st.dbBarOnly=el.checked;
      const hl=document.getElementById('hwlist');if(hl)hl.innerHTML=hwChips();rerender=false;
    }
    else if(f==='gymStep'){const n=num(v);if(n&&n>0)st.gymStep=n;}
    else{const n=parseInt(v);if(n>=0&&!isNaN(n))st[f]=(f==='heavyCount')?n:Math.max(1,n);}
  }
  saveSoon();if(rerender)render();
}

/* ---------- toiminnot ---------- */
function act(a,el){
  const ds=el.dataset;
  switch(a){
    case 'tab':view.tab=ds.tab;view.sub=null;render();scrollTo(0,0);break;
    case 'resume':view.tab='session';render();scrollTo(0,0);break;
    case 'start':startSession(ds.type,ds.tpl,ds.hurry==='1');break;
    case 'startcombo':startCombo(ds.id,ds.hurry==='1');break;
    case 'untick':{const t=ymd();const s=sortedSessions().find(s=>s.typeId===ds.type&&s.date===t&&s.kind==='tick');if(s){S.sessions=S.sessions.filter(x=>x!==s);save();render();}break;}
    case 'other':otherPicker();break;
    case 'rate':{if(+ds.ex<0){draft.rating=draft.rating===ds.r?null:ds.r;saveDraft();el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.r===draft.rating));}break;}
    case 'srate':{
      const i=+ds.ex,e=draft.exercises[i],s=e.sets[+ds.set];
      if(s.rating===ds.r){s.rating=null;s.t=null;}else{s.rating=ds.r;if(!s.t)s.t=new Date().toISOString();}
      saveDraft();
      if(s.rating&&e.sets.every(x=>x.rating)){e.collapsed=true;saveDraft();render();focusNext(i);}else render();
      break;}
    case 'exdone':{const i=+ds.ex;draft.exercises[i].collapsed=true;saveDraft();render();focusNext(i);break;}
    case 'expand':{const i=+ds.ex;draft.exercises[i].collapsed=false;saveDraft();render();const c=document.querySelector(`[data-card="${i}"]`);if(c)c.scrollIntoView({block:'start'});break;}
    case 'exinfo':exInfo(ds.id);break;
    case 'swap':swapPicker(+ds.ex);break;
    case 'swapto':{const p=document.getElementById('swapperm');swapEx(+ds.ex,ds.id,!!(p&&p.checked));break;}
    case 'chainup':swapEx(+ds.ex,ds.id,true);break;
    case 'step':{
      const e=draft.exercises[+ds.ex],j=+ds.set,s=e.sets[j],dir=+ds.d;
      if(ds.f==='reps'){s.reps=String(Math.max(0,(parseInt(s.reps)||0)+dir));}
      else{const ex=exById(e.exId),old=s.weight;let cur=num(s.weight);
        if(cur==null&&j>0)cur=num(e.sets[j-1].weight);
        const v=stepW(ex,cur,dir);
        if(v==null){if(dir<0&&cur!=null&&!weightList(ex)&&!(ex&&ex.base))s.weight='';else break;}
        else s.weight=v?fmtIn(v):'';
        fillDown(e,j,old,+ds.ex);}
      const inp=document.querySelector(`input[data-bind="set"][data-ex="${ds.ex}"][data-set="${j}"][data-f="${ds.f}"]`);if(inp)inp.value=s[ds.f];
      saveDraft();break;}
    case 'tycolor':{const t=typeById(ds.id);if(t){t.color=ds.c;save();render();}break;}
    case 'addset':{const e=draft.exercises[+ds.ex];const l=e.sets[e.sets.length-1];e.sets.push(l?{reps:l.reps,weight:l.weight,rating:null,t:null}:{reps:'10',weight:'',rating:null,t:null});e.collapsed=false;saveDraft();render();break;}
    case 'delset':draft.exercises[+ds.ex].sets.splice(+ds.set,1);saveDraft();render();break;
    case 'delex':if(confirm('Poistetaanko liike tältä kerralta? Treenipohja ei muutu.')){draft.exercises.splice(+ds.ex,1);saveDraft();render();}break;
    case 'applyhint':{const e=draft.exercises[+ds.ex];e.sets.forEach(s=>{s.weight=fmtIn(e.hint.weight);if(e.hint.reps)s.reps=String(e.hint.reps);});saveDraft();render();break;}
    case 'applyrange':{const e=draft.exercises[+ds.ex],nm=e.hint.newMax;let n=0;
      draftParts(draft).forEach(p=>{const ty=typeById(p.typeId),tpl=ty&&ty.templates.find(t=>t.id===p.templateId);if(tpl)tpl.items.forEach(it=>{if(it.exId===e.exId){it.repsMax=nm;n++;}});});
      e.rmax=nm;e.hint={type:'info',text:`Toistoalue ${e.rmin}–${nm}. Lisää toistoja samalla painolla.`};save();saveDraft();render();toast(n?`Toistoalue ${e.rmin}–${nm} tallennettu pohjaan`:'Toistoalue päivitetty tälle kerralle');break;}
    case 'finish':finishSession();break;
    case 'discard':if(confirm(draft.editing?'Perutaanko muokkaus? Muutoksia ei tallenneta.':'Hylätäänkö treeni? Kirjauksia ei tallenneta.')){const ed=draft.editing;draft=null;saveDraft();view.tab=ed?'history':'today';render();}break;
    case 'showsess':showSession(ds.id);break;
    case 'editsess':editSession(ds.id);break;
    case 'delsess':if(confirm('Poistetaanko kirjaus pysyvästi?')){S.sessions=S.sessions.filter(s=>s.id!==ds.id);save();closeModal();render();toast('Kirjaus poistettu');}break;
    case 'closemodal':pendingCoach=null;closeModal();break;
    case 'hsub':view.hsub=ds.k;render();break;
    case 'gomuscles':view.tab='history';view.hsub='muscles';view.mweek=null;render();scrollTo(0,0);break;
    case 'mweek':{const cur=view.mweek||weekStart(ymd());const n=addDays(cur,+ds.d);if(n<=weekStart(ymd()))view.mweek=n;render();break;}
    case 'report':openReport(ds.ws);break;
    case 'repcopy':copyText(view.reportTxt,'Raportti kopioitu').then(ok=>{if(!ok){const t=document.getElementById('reptxt');if(t){t.focus();t.select();}toast('Valitse teksti ja kopioi');}});break;
    case 'repshare':shareOrDownload(`treeniviikko-${isoWeek(view.reportWs)}.md`,view.reportTxt,'text/markdown');break;
    case 'coachapply':applyCoach();break;
    case 'opentype':view.sub={kind:'type',id:ds.id};render();scrollTo(0,0);break;
    case 'openex':view.sub={kind:'ex',id:ds.id};render();scrollTo(0,0);break;
    case 'openexplan':view.tab='plan';view.sub={kind:'ex',id:ds.id};render();scrollTo(0,0);break;
    case 'back':view.sub=null;render();break;
    case 'newtype':{const t={id:uid(),color:PALETTE[S.types.length%PALETTE.length],name:'Uusi treenityyppi',schedule:'flexible',quota:1,weekday:1,pair:'',logStyle:'full',templates:[{id:uid(),name:'Perus',note:'',items:[]}]};S.types.push(t);save();view.sub={kind:'type',id:t.id};render();scrollTo(0,0);break;}
    case 'deltype':if(confirm('Poistetaanko treenityyppi? Historia säilyy.')){S.types=S.types.filter(t=>t.id!==ds.id);S.combos.forEach(c=>c.parts=c.parts.filter(p=>p.typeId!==ds.id));save();view.sub=null;render();}break;
    case 'newtpl':typeById(ds.ty).templates.push({id:uid(),name:'Uusi pohja',note:'',items:[]});save();render();break;
    case 'deltpl':if(confirm('Poistetaanko pohja?')){const t=typeById(ds.ty);t.templates=t.templates.filter(p=>p.id!==ds.tpl);save();render();}break;
    case 'additem':{const p=typeById(ds.ty).templates.find(p=>p.id===ds.tpl);const first=S.exercises.find(x=>!x.archived);if(!first){alert('Lisää ensin liike liikepankkiin.');break;}p.items.push({exId:first.id,sets:3,repsMin:S.settings.repsMin,repsMax:S.settings.repsMax,weight:'',core:true});save();render();break;}
    case 'itemup':{const p=typeById(ds.ty).templates.find(p=>p.id===ds.tpl);const i=+ds.i;if(i>0){[p.items[i-1],p.items[i]]=[p.items[i],p.items[i-1]];save();render();}break;}
    case 'itemdel':{const p=typeById(ds.ty).templates.find(p=>p.id===ds.tpl);p.items.splice(+ds.i,1);save();render();break;}
    case 'itemcore':{const it=typeById(ds.ty).templates.find(p=>p.id===ds.tpl).items[+ds.i];it.core=it.core===false;save();render();break;}
    case 'combonew':{const opts=S.types.filter(t=>t.logStyle==='full'&&t.templates.length);if(opts.length<2){alert('Yhdistelmään tarvitaan vähintään kaksi treenityyppiä, joilla on pohja.');break;}
      S.combos.push({id:uid(),name:'Uusi yhdistelmä',parts:opts.slice(0,2).map(t=>({typeId:t.id,tplId:t.templates[0].id}))});save();render();break;}
    case 'combodel':if(confirm('Poistetaanko yhdistelmä?')){S.combos=S.combos.filter(c=>c.id!==ds.id);save();render();}break;
    case 'comboaddpart':{const c=S.combos.find(c=>c.id===ds.id);const t=S.types.find(t=>t.logStyle==='full'&&t.templates.length);if(c&&t){c.parts.push({typeId:t.id,tplId:t.templates[0].id});save();render();}break;}
    case 'combodelpart':{const c=S.combos.find(c=>c.id===ds.id);if(c){c.parts.splice(+ds.i,1);save();render();}break;}
    case 'newex':{const g=(S.muscleGroups[0]||{}).id||'';const x={id:uid(),name:'Uusi liike',muscle:g,muscles:g?{[g]:1}:{},equip:'machine',step:null,base:null,ladder:null,desc:'',archived:false,easier:null,next:null};S.exercises.push(x);save();view.sub={kind:'ex',id:x.id};render();scrollTo(0,0);break;}
    case 'newharder':{const x=exById(ds.id);const y={id:uid(),name:x.name+' (vaikeampi)',muscle:x.muscle,muscles:{...x.muscles},equip:x.equip,step:x.step,base:x.base,ladder:x.ladder?[...x.ladder]:null,desc:'',archived:false,easier:x.id,next:null};
      S.exercises.push(y);save();view.sub={kind:'ex',id:y.id};render();scrollTo(0,0);toast('Uusi vaihe luotu – nimeä se');break;}
    case 'exnclear':{const x=exById(ds.id);if(x){x.next=null;save();render();}break;}
    case 'exarch':{const x=exById(ds.id);if(!x)break;
      if(!x.archived){const inT=[];S.types.forEach(t=>t.templates.forEach(p=>{if(p.items.some(i=>i.exId===x.id))inT.push(p.name);}));
        if(inT.length){alert('Liike on käytössä pohjissa: '+inT.join(', ')+'. Poista tai vaihda se ensin pohjista.');break;}}
      x.archived=!x.archived;save();render();toast(x.archived?'Liike arkistoitu':'Liike palautettu');break;}
    case 'delexl':{
      const used=S.types.some(t=>t.templates.some(p=>p.items.some(i=>i.exId===ds.id)));
      if(used){alert('Liike on käytössä treenipohjassa. Poista se ensin pohjista.');break;}
      if(confirm('Poistetaanko liike liikepankista? Historia säilyy. (Arkistointi piilottaa liikkeen poistamatta sitä.)')){S.exercises.forEach(y=>{if(y.easier===ds.id)y.easier=null;});S.exercises=S.exercises.filter(x=>x.id!==ds.id);save();view.sub=null;render();}break;}
    case 'mgadd':S.muscleGroups.push({id:uid(),name:'Uusi lihasryhmä',min:null,max:null});save();render();break;
    case 'mgdel':{
      const used=S.exercises.filter(x=>x.muscles&&x.muscles[ds.id]).length;
      if(used){alert(`Lihasryhmää käyttää ${used} liikettä. Poista kerroin niistä ensin.`);break;}
      S.muscleGroups=S.muscleGroups.filter(g=>g.id!==ds.id);S.settings.ratioRules=S.settings.ratioRules.filter(r=>r.a!==ds.id&&r.b!==ds.id);save();render();break;}
    case 'rradd':{const g=S.muscleGroups;if(g.length<2)break;S.settings.ratioRules.push({a:g[0].id,b:g[1].id,k:1});save();render();break;}
    case 'rrdel':S.settings.ratioRules.splice(+ds.i,1);save();render();break;
    case 'diskadd':S.settings.dbDiskCounts.push({w:1,n:4});save();render();break;
    case 'diskdel':S.settings.dbDiskCounts.splice(+ds.i,1);save();render();break;
    case 'reseedprog':if(confirm('Korvataanko treenityypit, yhdistelmät ja liikepankki oletusohjelmalla? Historia säilyy.')){applySeedProgram(S);S=normalize(S);save();view.sub=null;render();toast('Oletusohjelma palautettu');}break;
    case 'exportjson':exportJson();break;
    case 'exportcsv':exportCsv();break;
    case 'copytsv':copyTsv();break;
    case 'import':document.getElementById('importfile').click();break;
    case 'reset':if(confirm('Tyhjennetäänkö KAIKKI tiedot? Tätä ei voi perua.')&&confirm('Oletko varma? Tallenna varmuuskopio ensin, jos haluat säilyttää historian.')){S=normalize(seed());draft=null;save();saveDraft();view.tab='today';render();}break;
  }
}
function onChange(kind,el){
  if(kind==='addex'&&el.value){draft.exercises.push(buildEx(el.value,null,0));saveDraft();render();}
  if(kind==='hex'){view.hex=el.value;render();}
  if(kind==='coachpick'&&pendingCoach){const o=pendingCoach[el.dataset.k][+el.dataset.i];if(o)o.on=el.checked;const b=document.getElementById('coachbtn');if(b)b.textContent=coachBtnLabel();}
}
document.addEventListener('click',e=>{
  if(e.target.id==='modalbg'){pendingCoach=null;closeModal();return;}
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT'||el.disabled)return;act(el.dataset.act,el);
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'){e.preventDefault();e.target.click();}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.bind&&el.tagName!=='SELECT'&&el.type!=='checkbox')bind(el,false);});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset)return;
  if(el.dataset.bind&&(el.tagName==='SELECT'||el.type==='checkbox'))bind(el,el.tagName==='SELECT');else if(el.dataset.change)onChange(el.dataset.change,el);});

/* ---------- runko ---------- */
function openModal(html){document.getElementById('modal').innerHTML=`<div id="modalbg"><div class="panel">${html}</div></div>`;}
function closeModal(){document.getElementById('modal').innerHTML='';}
let toastT=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}
function render(){
  const v={today:vToday,session:vSession,history:vHistory,plan:vPlan,settings:vSettings}[view.tab]||vToday;
  document.body.classList.toggle('insession',view.tab==='session'&&!!draft);
  document.getElementById('app').innerHTML=v();
  const navTab=view.tab==='session'?'today':view.tab;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===navTab));
}
load();render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(p=>{persisted=p;}).catch(()=>{});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
